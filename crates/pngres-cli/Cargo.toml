[package]
name = "pngres-cli"
description = "CLI for PNGres — summon and recall files from herds of monkes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "pngres"
path = "src/main.rs"

[dependencies]
pngres-core   = { workspace = true }
pngres-server = { workspace = true, optional = true }
clap          = { version = "4", features = ["derive", "wrap_help"] }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
tracing-subscriber = { workspace = true }
zip           = { version = "2", default-features = false, features = ["deflate"] }
indicatif     = "0.17"
humansize     = "2"
serde         = { workspace = true }
serde_json    = { workspace = true }
reqwest       = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "http2"] }
url           = "2"
blake3        = { workspace = true }
tokio         = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[features]
default = []
serve   = ["dep:pngres-server", "dep:tokio"]

[dev-dependencies]
assert_cmd   = "2"
predicates   = "3"
assert_fs    = "1"
tempfile     = { workspace = true }
sha2         = "0.10"
